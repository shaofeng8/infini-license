# license.infinisynapse.cn —— 宿主机 nginx 反代配置
#
# 放到 /etc/nginx/conf.d/ 下，证书签好后 `nginx -t && systemctl reload nginx`。
#
# 拓扑：
#   公网 :443 ── 宿主 nginx ─┬─ /api/ ─→ 127.0.0.1:3010  (server 容器)
#                            └─ /     ─→ 127.0.0.1:5273  (web 容器，静态站)
#
# /api 直连 server 而不是再经 web 容器转一道，有两个原因：
#   1. 少一跳，Express 的 trust proxy 只需要信任 1 层，客户端就无法伪造
#      X-Forwarded-For 把审计日志里的 IP 写成任意值；
#   2. API 和静态资源的超时、缓存、限流诉求本来就不一样，分开配才讲得清。
#
# 这两个端口在 docker-compose 里只绑了 127.0.0.1，公网碰不到，
# 唯一入口就是下面这个 443。

upstream license_api {
    server 127.0.0.1:3010;
    keepalive 32;
}

upstream license_web {
    server 127.0.0.1:5273;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP：只做两件事 —— 放行 ACME 续签，其余全部跳 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name license.infinisynapse.cn;

    # 这一段必须在 return 301 之前。放到后面的话，Let's Encrypt 的校验请求
    # 会被跳转吃掉，证书到期那天才会发现续签一直在失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name license.infinisynapse.cn;

    ssl_certificate     /etc/letsencrypt/live/license.infinisynapse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.infinisynapse.cn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 这套后台签发的凭证决定客户能不能开门做生意，凭证下载走的就是这条链路。
    # HSTS 关掉降级到 HTTP 的可能；includeSubDomains 前请确认该域名下
    # 没有必须走 HTTP 的子域
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # 内部系统，不要被搜索引擎收录
    add_header X-Robots-Tag              "noindex, nofollow" always;

    # 凭证信封是文本，几 KB；用量上报单批上限约 4MB（与 server 的
    # useBodyParser limit 对齐）。设小了客户端会拿到 nginx 的 413，
    # 那个页面不带业务错误码，客户端只能报「未知错误」
    client_max_body_size 8m;

    access_log /var/log/nginx/license.access.log;
    error_log  /var/log/nginx/license.error.log warn;

    # ---------------- API ----------------
    location /api/ {
        proxy_pass http://license_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # server 侧配了 trust proxy = 1，会取这条链最右边那一跳之前的地址。
        # 审计日志里「谁下载了凭证」的 IP 和限流分桶都依赖它
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 凭证下载是流式文本，缓冲住没意义，还会让大响应先落盘
        proxy_buffering off;
    }

    # Swagger 只在 NODE_ENV=development 时注册，生产上本来就是 404。
    # 这里再挡一道：万一哪天有人为了排查把生产切成 development，
    # 也不至于把整套接口结构直接挂到公网上
    location /api/docs {
        return 404;
    }

    # ---------------- 静态站 ----------------
    location / {
        proxy_pass http://license_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
