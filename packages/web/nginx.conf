server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后台是内部系统，不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 只提供静态站。/api 由前面的 CLB/ALB 按路径转到 server 应用。
    # 不要在这里 proxy_pass 到主机名 server：那是 compose 服务名，
    # SAE 上解析不到，nginx 会 emerg 退出、容器一直崩溃。

    # index.html 绝不缓存。
    # 带 hash 的 assets 可以永久缓存，但入口文件一旦被缓存，
    # 发版后用户拿到的是旧 index 指向已被删除的 chunk，页面直接白屏
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma  "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 文件名里带内容 hash，改了就是新文件名，可以放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 前端路由兜底：/license/xxx 这类路径在磁盘上没有对应文件，
    # 必须回 index.html 交给 react-router，否则刷新详情页就是 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;
}
